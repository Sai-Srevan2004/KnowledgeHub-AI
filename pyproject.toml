[project]
name = "knowledgehub-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sai-Srevan2004", email = "22bd1a057l@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
knowledgehub-ai = "knowledgehub:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "knowledgehub"
module-root = "src"